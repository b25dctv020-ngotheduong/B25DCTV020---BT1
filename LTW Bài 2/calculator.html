<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - Máy tính</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="may-tinh">
        <div id="manHinh">0</div>
        
        <div class="ban-phim">
            <button class="nut">7</button>
            <button class="nut">8</button>
            <button class="nut">9</button>
            <button class="nut phep-tinh">+</button>
            
            <button class="nut">4</button>
            <button class="nut">5</button>
            <button class="nut">6</button>
            <button class="nut phep-tinh">-</button>
            
            <button class="nut">1</button>
            <button class="nut">2</button>
            <button class="nut">3</button>
            <button class="nut phep-tinh">*</button>
            
            <button class="nut" id="nutClear">Clear</button>
            <button class="nut">0</button>
            <button class="nut phep-tinh">=</button>
            <button class="nut phep-tinh">/</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
